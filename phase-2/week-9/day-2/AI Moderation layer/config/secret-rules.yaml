version: 1.0.0
rules:
  - id: SECRET-APIKEY-001
    category: API_KEY
    pattern: >-
      \b(?:api[_-]?key|api[_-]?token)\s*[:=]\s*["']?[A-Za-z0-9._~+/-]{8,}["']?
  - id: SECRET-CREDENTIAL-001
    category: CREDENTIAL
    pattern: >-
      \b(?:password|passwd|secret|access[_-]?token|auth[_-]?token|client[_-]?secret)\s*[:=]\s*["']?[^\s"',;]{8,}
  - id: SECRET-PRIVATEKEY-001
    category: PRIVATE_KEY
    pattern: >-
      -----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----
  - id: SECRET-AWS-001
    category: API_KEY
    pattern: >-
      \bAKIA[0-9A-Z]{16}\b
  - id: SECRET-GITHUB-001
    category: API_KEY
    pattern: >-
      \bgh[pousr]_[A-Za-z0-9_]{20,}\b
  - id: SECRET-OPENAI-001
    category: API_KEY
    pattern: >-
      \bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b
