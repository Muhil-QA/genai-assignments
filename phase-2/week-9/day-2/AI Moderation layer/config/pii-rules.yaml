version: 1.0.0
rules:
  - id: PII-EMAIL-001
    category: EMAIL_ADDRESS
    action: MASK
    pattern: >-
      (?<![A-Z0-9._%+-])[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}(?![A-Z0-9.-])
  - id: PII-PHONE-001
    category: PHONE_NUMBER
    action: MASK
    pattern: >-
      (?<![A-Z0-9])(?:\+?91[\s.-]?)?[6-9][0-9]{4}[\s.-]?[0-9]{5}(?![A-Z0-9])
  - id: PII-PAYMENT-CARD-001
    category: PAYMENT_CARD
    action: BLOCK
    pattern: >-
      (?<![0-9])[0-9](?:[0-9 -]{11,25})[0-9](?![0-9])
  - id: PII-AADHAAR-IN-001
    category: GOVERNMENT_ID
    action: BLOCK
    pattern: >-
      (?<![0-9])[2-9][0-9]{3}[\s-]?[0-9]{4}[\s-]?[0-9]{4}(?![0-9])
  - id: PII-PAN-IN-001
    category: GOVERNMENT_ID
    action: BLOCK
    pattern: >-
      (?<![A-Z0-9])[A-Z]{5}[0-9]{4}[A-Z](?![A-Z0-9])
