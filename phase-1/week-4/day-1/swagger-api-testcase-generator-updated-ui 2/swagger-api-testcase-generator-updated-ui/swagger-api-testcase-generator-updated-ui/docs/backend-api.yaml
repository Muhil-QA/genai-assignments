openapi: 3.0.3
info:
  title: Swagger API Testcase Generator Backend
  version: 0.1.0
servers:
  - url: http://localhost:4000/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200": { description: Backend is healthy }
  /swagger/upload:
    post:
      summary: Upload and validate Swagger YAML or JSON
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201": { description: File uploaded and validation completed }
        "400": { description: Invalid file }
  /swagger/upload-link:
    post:
      summary: Fetch and validate Swagger YAML or JSON from a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  pattern: "^https?://"
      responses:
        "201": { description: Remote specification fetched and validation completed }
        "400": { description: Invalid or blocked URL }
        "413": { description: Remote specification is too large }
        "502": { description: Remote specification could not be fetched }
        "504": { description: Remote fetch timed out }
  /swagger/validate:
    post:
      summary: Revalidate the active Swagger document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200": { description: Validation report }
  /swagger/correct:
    post:
      summary: Correct the active Swagger document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
                applySafeCorrectionsOnly: { type: boolean, default: false }
      responses:
        "200": { description: Correction report }
  /sessions/{sessionId}/confirm-test-generation:
    post:
      summary: Confirm testcase generation
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, enum: [true] }
      responses:
        "200": { description: Confirmation stored }
  /testcases/generate:
    post:
      summary: Generate API testcases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, categories]
              properties:
                sessionId: { type: string, format: uuid }
                categories:
                  type: array
                  items:
                    type: string
                    enum: [positive, negative, boundary, authentication, authorization, validation, error-handling]
      responses:
        "200":
          description: Generated testcases with derived standard QA classifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestcaseGenerationResponse"
  /postman/generate:
    post:
      summary: Generate Postman collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string, format: uuid }
                includeBasicTests: { type: boolean, default: true }
      responses:
        "200": { description: Postman collection generated }
  /sessions/{sessionId}/summary:
    get:
      summary: Get processing summary
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Session summary }
  /sessions/{sessionId}/testcases:
    get:
      summary: Get generated testcases
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Generated testcases }
  /sessions/{sessionId}/export/json:
    get:
      summary: Download testcases as JSON
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: JSON export }
  /sessions/{sessionId}/export/excel:
    get:
      summary: Download testcases as Excel
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Excel export }
  /sessions/{sessionId}/export/swagger:
    get:
      summary: Download active corrected Swagger
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Swagger export }
  /sessions/{sessionId}/export/postman:
    get:
      summary: Download Postman collection
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Postman collection export }
  /sessions/{sessionId}:
    delete:
      summary: Clear processing session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Session cleared }
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    SessionRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string, format: uuid }
    StandardTestType:
      type: string
      description: Evidence-based QA classification. A testcase may have multiple types.
      enum: [Smoke, Sanity, Regression, Functional, Integration, End-to-End, API/Contract, Validation, Negative, Boundary, Security, Performance, Compatibility, Usability, Exploratory]
    ApiTestCase:
      type: object
      required: [testCaseId, endpoint, method, category, standardTestTypes, title, priority, preconditions, headers, pathParameters, queryParameters, steps, expectedStatusCode, expectedResult, sourceReferences]
      properties:
        testCaseId: { type: string }
        operationId: { type: string }
        endpoint: { type: string }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE] }
        category: { type: string, enum: [positive, negative, boundary, authentication, authorization, validation, error-handling] }
        standardTestTypes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/StandardTestType" }
        title: { type: string }
        priority: { type: string, enum: [High, Medium, Low] }
        preconditions: { type: array, items: { type: string } }
        headers: { type: object, additionalProperties: true }
        pathParameters: { type: object, additionalProperties: true }
        queryParameters: { type: object, additionalProperties: true }
        requestBody: {}
        steps: { type: array, items: { type: string } }
        expectedStatusCode: { type: integer, minimum: 100, maximum: 599 }
        expectedResult: { type: string }
        sourceReferences: { type: array, items: { type: string } }
    TestcaseSummary:
      type: object
      required: [totalTestCases, standardTestTypes]
      properties:
        totalTestCases: { type: integer }
        standardTestTypes:
          type: object
          additionalProperties: { type: integer }
    TestcaseGenerationResponse:
      type: object
      required: [sessionId, generationSource, summary, testCases]
      properties:
        sessionId: { type: string, format: uuid }
        generationSource: { type: string }
        generationModel: { type: string }
        summary: { $ref: "#/components/schemas/TestcaseSummary" }
        testCases:
          type: array
          items: { $ref: "#/components/schemas/ApiTestCase" }
